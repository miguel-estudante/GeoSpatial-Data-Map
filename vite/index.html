<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Road accident analyzer</title>
        <script type="module" src="/src/main.js" defer></script>
        <script type="module" src="/src/animations.js" defer></script>

        <link rel="stylesheet" href="/src/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
     </head>
    <body>
        <div class="relative h-screen">
            <div id="map" class="w-screen h-screen z-10"></div>

            <div id="new-accident-panel" class="hidden absolute top-[52vh] left-[42.5vw] z-1000 bg-white rounded-xl shadow-lg border border-neutral-300 p-4 w-72">
                <h3 class="text-lg font-inter font-semibold mb-3">New accident</h3>
                
                <label class="block text-sm mb-1">Severity</label>
                <select id="acc-sev" class="w-full border rounded px-2 py-1 text-sm mb-3">
                    <option value="Slight">Slight</option>
                    <option value="Serious">Serious</option>
                    <option value="Fatal">Fatal</option>
                </select>

                <label class="block text-sm mb-1">Weather</label>
                <select id="acc-wea" class="w-full border rounded px-2 py-1 text-sm mb-3">
                    <option value="Fine">Fine</option>
                    <option value="Raining">Raining</option>
                    <option value="Snowing">Snowing</option>
                    <option value="Fog">Fog</option>
                </select>

                <label class="block text-sm mb-1">Date</label>
                <input id="acc-date" type="date" class="w-full border rounded px-2 py-1 text-sm mb-3" />
                <div class="flex justify-end gap-2">
                    <button id="acc-cancel" class="px-3 py-1 text-sm rounded border border-neutral-300 hover:bg-gray-100">
                        Cancel
                    </button>

                    <button id="acc-save" class="px-3 py-1 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">
                        Save
                    </button>
                </div>
            </div>

            <div id="info-sidebar" class="fixed top-[2.5vh] left-[1vw] h-[85vh] transform -translate-x-[calc(100%+1vw)] transition-transform duration-300 z-50">
                <button id="info-toggle" class="absolute -right-20 w-15 h-15 bg-gray-50 rounded-xl shadow-md flex items-center justify-center hover:bg-gray-100 hover:scale-95 border border-neutral-300 cursor-pointer">
                    <i class="fa-solid fa-chart-simple text-2xl"></i>
                </button>
                <aside id="info-content" class="w-[35vw] h-full bg-gray-50 p-4 rounded-2xl border shadow-md border-neutral-300 overflow-y-auto z-50 font-inter flex flex-col"></aside>
            </div>

            <div id="filter-sidebar" class="fixed top-[2.5vh] right-[1vw] h-[90vh] transform translate-x-[calc(100%+1vw)] transition-transform duration-300 z-50">
                <button id="filter-toggle" class="absolute -left-20 w-15 h-15 bg-gray-50 rounded-xl shadow-md flex items-center justify-center hover:bg-gray-100 hover:scale-95 border border-neutral-300 cursor-pointer">
                    <i class="fa-solid fa-filter text-2xl"></i>
                </button>
                
                <button id="fullExtentBtn" class="absolute -left-20 top-20 w-15 h-15 bg-gray-50 rounded-xl shadow-md flex items-center justify-center hover:bg-gray-100 hover:scale-95 border border-neutral-300 cursor-pointer">
                    <i class="fa-solid fa-arrows-up-down-left-right text-2xl"></i>
                </button>
                
                <div id="bulk-import-wrapper" class="relative -left-20 top-40">
                    <button id="bulk-import-btn" class="absolute w-15 h-15 bg-gray-50 rounded-xl shadow-md flex items-center justify-center hover:bg-gray-100 hover:scale-95 border border-neutral-300 cursor-pointer">
                        <i class="fa-solid fa-file-import text-2xl"></i>
                    </button>

                    <div id="bulk-dropzone" class="hidden absolute right-57 border-2 border-dashed border-gray-300 rounded-xl px-2 py-2 bg-white/90 shadow-md w-72 flex-col gap-3">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-inter font-semibold text-gray-700">
                                Import accidents (CSV)
                            </span>
                            
                            <button id="bulk-dropzone-close" class="text-gray-400 hover:text-gray-600">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div id="bulk-dropzone-inner" class="flex flex-col items-center justify-center gap-2 text-center text-xs text-gray-600 py-4 cursor-pointer">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-500 mb-1"></i>
                            <span>Drop a CSV file here</span>
                            <span class="text-[11px] text-gray-400">or click to choose a file</span>
                        </div>

                        <input type="file" id="bulk-csv-input" accept=".csv" class="hidden">
                    </div>
                </div>
                
                <aside class="w-72 h-full bg-gray-50 p-4 rounded-2xl border shadow-md border-neutral-300 overflow-y-auto z-50">
                    <div class="flex items-center justify-between mb-10 ">
                        <h2 class="text-3xl font-inter font-semibold">Filters</h2>
                        <button>
                            <i class="fa-solid fa-xmark text-gray-300  text-2xl cursor-pointer hover:text-gray-500 hover:scale-90" id="close-filters"></i>
                        </button>
                    </div>

                    <div class="mb-6">  
                        <label class="mb-10 select-none">
                            <input class="peer absolute scale-0" type="checkbox" id="severity-toggle"/>
                            <h3 class="flex items-center justify-between text-lg font-inter mb-1 cursor-pointer rounded-lg transition-normal duration-200 hover:bg-gray-200 hover:pl-2 hover:pr-2">
                                Severity
                                <i class="text-sm fa-solid fa-chevron-right transition-transform duration-300" id="severity-icon"></i>
                            </h3>
                            <span class="block max-h-0 max-w-xs overflow-hidden rounded-lg transition-all duration-300 peer-checked:max-h-19">
                                <form id="severity-filter" class="space-y-1 p-1">
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" class="mr-2 rounded-sm" name="severity" value="Slight">Slight</label>
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" class="mr-2 rounded-sm" name="severity" value="Serious">Serious</label>
                                    <label class="flex items-center font-inter text-sm "><input type="checkbox" class="mr-2 rounded-sm" name="severity" value="Fatal">Fatal</label>
                                </form>
                            </span>
                        </label>
                    </div>

                    <div class="mb-6">  
                        <label class="select-none">
                            <input class="peer absolute scale-0" type="checkbox" id="weather-toggle"/>
                            <h3 class="flex items-center justify-between text-lg font-inter mb-1 cursor-pointer rounded-lg transition-normal duration-200 hover:bg-gray-200 hover:pl-2 hover:pr-2">
                                Weather
                                <i class="text-sm fa-solid fa-chevron-right transition-transform duration-300" id="weather-icon"></i>
                            </h3>
                            <span class="block max-h-0 max-w-xs overflow-hidden rounded-lg transition-all duration-300 peer-checked:max-h-25 ">
                                <form id="weather-filter" class="space-y-1 p-1">
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" name="weather" value="Fine" class="mr-2 rounded-sm">Fine</label>
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" name="weather" value="Raining" class="mr-2 rounded-sm">Raining</label>
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" name="weather" value="Snowing" class="mr-2 rounded-sm">Snowing</label>
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" name="weather" value="Fog" class="mr-2 rounded-sm">Fog</label>
                                </form>
                            </span>
                        </label>
                    </div>

                    <div class="mb-6">  
                        <label class="mb-10 select-none">
                            <input class="peer absolute scale-0" type="checkbox" id="weekdays-toggle"/>
                            <h3 class="flex items-center justify-between text-lg font-inter mb-1 cursor-pointer rounded-lg transition-normal duration-200 hover:bg-gray-200 hover:pl-2 hover:pr-2">
                                Days of the week
                                <i class="text-sm fa-solid fa-chevron-right transition-transform duration-300" id="weekdays-icon"></i>
                            </h3>
                            <span class="block max-h-0 max-w-xs overflow-hidden rounded-lg transition-all duration-300 peer-checked:max-h-42">
                                <form id="weekdays-filter" class="space-y-1 p-1">
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Monday">Monday</label>
                                    <label class="flex items-center font-inter text-sm"><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Tuesday">Tuesday</label>
                                    <label class="flex items-center font-inter text-sm "><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Wednesday">Wednesday</label>
                                    <label class="flex items-center font-inter text-sm "><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Thursday">Wednesday</label>
                                    <label class="flex items-center font-inter text-sm "><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Friday">Friday</label>
                                    <label class="flex items-center font-inter text-sm "><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Saturday">Saturday</label>
                                    <label class="flex items-center font-inter text-sm "><input type="checkbox" class="mr-2 rounded-sm" name="weekday" value="Sunday">Sunday</label>
                                </form>
                            </span>
                        </label>
                    </div>

                    <button id="apply-filters" class="w-full mt-6 bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-inter  transition-transform duration-200 hover:scale-98 cursor-pointer">Apply Filters</button>
                    <div class="mt-6 border-t border-gray-200 pt-4 font-inter">
                        <h3 class="text-lg font-inter font-semibold mb-2">Spatial filters</h3>
                        
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input id="toggle-buffer" type="checkbox" class="sr-only peer">
                            <span>Enable buffer click</span>
                            <div class="w-12 h-6 bg-gray-300 rounded-full peer-checked:bg-blue-500 relative transition-colors peer-checked:[&>div]:translate-x-6">
                                <div class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-all"></div>
                            </div>
                        </label>
                        
                        <label class="block text-sm mb-1">
                            Radius: 
                            <span id="buffer-radius-value" class="font-semibold">5</span> km
                        </label>
                        <input id="buffer-radius" type="range" min="1" max="50" step="1" value="5" class="w-full"/>

                        <button id="clear-buffer" class="w-full mt-3 bg-gray-200 text-gray-800 py-2 rounded hover:bg-gray-300 transition-transform duration-200 hover:scale-98 cursor-pointer">
                            Clear Buffer
                        </button>
                    </div>
                </aside>
            </div>

            <div id="map-legend" class="fixed bottom-[2.5vh] right-[1vw] h-23 w-30 z-25">
                <div id="legend-severity" class="bg-gray-50 p-2 rounded-2xl text-sm border shadow-md border-neutral-300 overflow-y-auto z-50 font-inter">
                    <div class="flex justify-between items-center">
                        <i class="fa-solid fa-circle text-red-500"></i>
                        <p>Fatal</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <i class="fa-solid fa-circle text-orange-500"></i>
                        <p>Serious</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <i class="fa-solid fa-circle text-yellow-500"></i>
                        <p>Slight</p>
                    </div>
                </div>
                <div id="legend-choropleth" class="bg-gray-50 p-2 rounded-2xl text-sm border shadow-md border-neutral-300 overflow-y-auto z-50 font-inter hidden">
                    <div class="flex justify-between items-center">
                        <i class="fa-solid fa-circle text-choroDark"></i>
                        <p>+50</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <i class="fa-solid fa-circle text-choroMed"></i>
                        <p>10-20</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <i class="fa-solid fa-circle text-choroLight"></i>
                        <p>0</p>
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
